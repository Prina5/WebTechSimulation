<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="The five ocean zones stacked from surface to seafloor">
  <rect y="0"   width="800" height="80" fill="#1b7690"/>
  <rect y="80"  width="800" height="80" fill="#134a64"/>
  <rect y="160" width="800" height="80" fill="#0b2638"/>
  <rect y="240" width="800" height="80" fill="#06151f"/>
  <rect y="320" width="800" height="80" fill="#02080c"/>
  <g font-family="Verdana, sans-serif" fill="#e8f6f6">
    <text x="30" y="40" font-size="22" font-weight="bold">Sunlight zone</text>
    <text x="30" y="64" font-size="15">0 to 200 m</text>
    <text x="30" y="120" font-size="22" font-weight="bold">Twilight zone</text>
    <text x="30" y="144" font-size="15">200 to 1,000 m</text>
    <text x="30" y="200" font-size="22" font-weight="bold">Midnight zone</text>
    <text x="30" y="224" font-size="15">1,000 to 4,000 m</text>
    <text x="30" y="280" font-size="22" font-weight="bold">Abyssal zone</text>
    <text x="30" y="304" font-size="15">4,000 to 6,000 m</text>
    <text x="30" y="360" font-size="22" font-weight="bold">Hadal zone</text>
    <text x="30" y="384" font-size="15">6,000 to 11,000 m</text>
  </g>
  <circle cx="640" cy="45" r="14" fill="#8fe9e4"/>
  <circle cx="560" cy="130" r="6" fill="#5db7d6"/>
  <circle cx="700" cy="215" r="5" fill="#ffc857"/>
  <circle cx="620" cy="290" r="4" fill="#c9a2f2"/>
  <circle cx="680" cy="365" r="3" fill="#ff9aa8"/>
</svg>
